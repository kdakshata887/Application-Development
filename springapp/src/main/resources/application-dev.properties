# ============================================================
# Development profile overrides — DO NOT use in production.
# Activate with: -Dspring.profiles.active=dev
# OR set SPRING_PROFILES_ACTIVE=dev environment variable.
# ============================================================

# Dev-only JWT secret — intentionally weak, only for local development
app.jwt.secret=dev-only-secret-do-not-use-in-production-minimum-256-bits-long-key-here-abc123

# Dev DB — local MySQL credentials (dev only, never commit real creds to prod config)
spring.datasource.url=jdbc:mysql://localhost:3306/school_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2006.ajju.}

# Show SQL in dev for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS — allow both common dev ports
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:5173

logging.level.com.examly.springapp=DEBUG
logging.level.org.springframework.security=DEBUG
