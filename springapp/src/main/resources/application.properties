spring.application.name=School Timetable and Attendance Management System
# Database — set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:D@18}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8082
# JWT — JWT_SECRET MUST be set as an environment variable in production; no fallback default
# Generate a secret with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:SKCET_Timetable_App_2026_JWT_Secret_9xK7mP2qL8vR}
app.jwt.expiration-ms.student=28800000
app.jwt.expiration-ms.parent=28800000
app.jwt.expiration-ms.teacher=43200000
app.jwt.expiration-ms.default=43200000
app.jwt.expiration-ms.admin=86400000
app.security.lockout.stage1-attempts=5
app.security.lockout.stage1-minutes=15
app.security.lockout.stage2-attempts=10
app.security.lockout.stage2-minutes=30
app.security.lockout.stage3-attempts=15
app.security.lockout.stage3-minutes=1440
app.attendance.low-threshold-percent=75
app.notification.provider=mock
app.biometric.provider=mock
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@edutrack.local}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.security=WARN
logging.level.com.examly.springapp=DEBUG