spring.application.name=School Timetable and Attendance Management System

# ------------------------------------------------------------
# Datasource - MySQL (default). Switch to the H2 block below
# for quick local runs without installing MySQL.
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/school_timetable_attendance_db
spring.datasource.username=postgres
spring.datasource.password=Dakshata
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# Uncomment this block and comment the MySQL block above to
# run instantly against an in-memory H2 database.
# ------------------------------------------------------------
#spring.datasource.url=jdbc:h2:mem:schooldb;DB_CLOSE_DELAY=-1
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081

# ------------------------------------------------------------
# JWT configuration
# ------------------------------------------------------------
app.jwt.secret=ChangeThisSuperSecretKeyForJWTSigningInProductionEnvironment123456
app.jwt.expiration-ms.student=28800000
app.jwt.expiration-ms.parent=28800000
app.jwt.expiration-ms.teacher=43200000
app.jwt.expiration-ms.default=43200000
app.jwt.expiration-ms.admin=86400000

# ------------------------------------------------------------
# Account lockout policy
# ------------------------------------------------------------
app.security.lockout.stage1-attempts=5
app.security.lockout.stage1-minutes=15
app.security.lockout.stage2-attempts=10
app.security.lockout.stage2-minutes=30
app.security.lockout.stage3-attempts=15
app.security.lockout.stage3-minutes=1440

# ------------------------------------------------------------
# Attendance
# ------------------------------------------------------------
app.attendance.low-threshold-percent=75

# ------------------------------------------------------------
# Mail (optional - fill in for real notification dispatch)
# ------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.security=INFO
logging.level.com.examly.springapp=DEBUG
