spring.application.name=School Timetable and Attendance Management System

# ------------------------------------------------------------
# Datasource — PostgreSQL (production).
# Uncomment this block and comment the H2 block below for production.
# Override via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
# ------------------------------------------------------------
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_timetable_attendance_db}
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:postgres}
#spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# H2 In-Memory — active for local development (no install needed).
# Comment this block and uncomment PostgreSQL above for production.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:schooldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=8081

# ------------------------------------------------------------
# JWT — override via environment variable: JWT_SECRET
# IMPORTANT: Change this secret before deploying to production.
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:ChangeThisSuperSecretKeyForJWTSigningInProductionEnvironment123456}
app.jwt.expiration-ms.student=28800000
app.jwt.expiration-ms.parent=28800000
app.jwt.expiration-ms.teacher=43200000
app.jwt.expiration-ms.default=43200000
app.jwt.expiration-ms.admin=86400000

# ------------------------------------------------------------
# Account lockout policy
# ------------------------------------------------------------
app.security.lockout.stage1-attempts=5
app.security.lockout.stage1-minutes=15
app.security.lockout.stage2-attempts=10
app.security.lockout.stage2-minutes=30
app.security.lockout.stage3-attempts=15
app.security.lockout.stage3-minutes=1440

# ------------------------------------------------------------
# Attendance threshold
# ------------------------------------------------------------
app.attendance.low-threshold-percent=75

# ------------------------------------------------------------
# Notification provider: "mock" (default) or "email"
# ------------------------------------------------------------
app.notification.provider=mock

# ------------------------------------------------------------
# Biometric provider: "mock" (default) or "device"
# ------------------------------------------------------------
app.biometric.provider=mock

# ------------------------------------------------------------
# CORS — allowed origin for the frontend dev server
# ------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------
# Mail — override via environment variables: MAIL_USERNAME, MAIL_PASSWORD
# Leave as-is for local dev (mock notification provider is used by default)
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@edutrack.local}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.org.springframework.security=WARN
logging.level.com.examly.springapp=DEBUG
